<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="volts" x1="6" y1="0" x2="18" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b4cc0"/>
      <stop offset="0.5" stop-color="#dddddd"/>
      <stop offset="1" stop-color="#b40426"/>
    </linearGradient>
    <linearGradient id="cold" x1="2" y1="4" x2="6" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f83e0"/><stop offset="1" stop-color="#2c3aa0"/>
    </linearGradient>
    <linearGradient id="hot" x1="18" y1="4" x2="22" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0576f"/><stop offset="1" stop-color="#9a0320"/>
    </linearGradient>
  </defs>
  <!-- the field between two conductors, on the same blue-white-red scale the
       viewport preview uses -->
  <rect x="6.6" y="6.4" width="10.8" height="11.2" fill="url(#volts)" opacity="0.75"/>
  <!-- the low conductor, with its ground tick -->
  <rect x="2.2" y="4.4" width="4.4" height="15.2" rx="1.2" fill="url(#cold)"
        stroke="#222f88" stroke-width="1"/>
  <path d="M3.2 12 h2.4 M3.6 13.6 h1.6" fill="none" stroke="#ffffff"
        stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- the driven conductor, marked + -->
  <rect x="17.4" y="4.4" width="4.4" height="15.2" rx="1.2" fill="url(#hot)"
        stroke="#7a0219" stroke-width="1"/>
  <path d="M19.6 10.2 v3.6 M17.8 12 h3.6" fill="none" stroke="#ffffff"
        stroke-width="1.3" stroke-linecap="round"/>
</svg>
