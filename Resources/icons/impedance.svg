<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="zcurve" x1="2" y1="4" x2="22" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fb9a5"/><stop offset="1" stop-color="#12695a"/>
    </linearGradient>
  </defs>
  <!-- plot frame: a magnitude axis with a resonant |Z| curve on it -->
  <path d="M3.2 2.4 V20.4 H21.4" fill="none" stroke="#157a68" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4.4 17.4 C7.4 17.2 8.6 15.4 10.4 8.2 C11.2 4.8 12.6 4.8 13.4 8.2
           C15.0 15.0 16.6 16.6 20.4 16.8"
        fill="none" stroke="url(#zcurve)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the reference-impedance line the peak is read against -->
  <path d="M4.2 13.6 H20.4" fill="none" stroke="#a8ded2" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="2.6 2.4"/>
</svg>
