<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="xsfill" x1="3" y1="4" x2="12" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7d8f2"/><stop offset="1" stop-color="#6ba7df"/>
    </linearGradient>
    <clipPath id="xskept">
      <path d="M12 2.5 A9.5 9.5 0 0 0 12 21.5 Z"/>
    </clipPath>
  </defs>

  <!-- The half that was cut away, as a thin continuous arc: at 16 px a dashed
       one turns to fuzz, and the point it makes — "there was more here" — has
       to survive being small. -->
  <path d="M12 2.5 A9.5 9.5 0 0 1 12 21.5"
        fill="none" stroke="#7fb2e0" stroke-width="1.1"
        stroke-opacity="0.55"/>

  <!-- The kept half: one big pale shape, so the hatch on it can be dark. -->
  <path d="M12 2.5 A9.5 9.5 0 0 0 12 21.5 Z"
        fill="url(#xsfill)" stroke="#12406e" stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- Section hatching, dark on pale rather than pale on dark: at icon size
       that is the difference between reading as hatch and reading as texture.
       Four strokes, spaced wide. -->
  <g clip-path="url(#xskept)" stroke="#17538c" stroke-width="1.6"
     stroke-linecap="round">
    <path d="M0 13 L11 2"/>
    <path d="M1 18.5 L13 6.5"/>
    <path d="M4 22.5 L13 13.5"/>
    <path d="M10 24 L13 21"/>
  </g>

  <!-- The cutting plane, standing on the exposed face. -->
  <path d="M12 0.8 v22.4" fill="none" stroke="#e08a2e" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>
