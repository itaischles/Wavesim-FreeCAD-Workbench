<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="xsbody" x1="4" y1="6" x2="18" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63a1dc"/><stop offset="1" stop-color="#1f5892"/>
    </linearGradient>
    <pattern id="xshatch" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#9fc6e8"/>
      <path d="M-1 1 l2 -2 M0 3 l3 -3 M2 4 l2 -2"
            stroke="#101820" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- the half that was cut away, left as a ghost outline -->
  <path d="M12 3.2 L20.5 7.2 L20.5 15.6 L12 19.6 Z"
        fill="none" stroke="#7fb2e0" stroke-width="1"
        stroke-opacity="0.55" stroke-dasharray="1.6 1.4"/>

  <!-- the kept half -->
  <path d="M3.5 7.2 L12 3.2 L12 19.6 L3.5 15.6 Z"
        fill="url(#xsbody)" stroke="#12406e" stroke-width="1.3"
        stroke-linejoin="round"/>

  <!-- the capped section face, hatched -->
  <path d="M12 3.2 L15.2 4.7 L15.2 18.1 L12 19.6 Z"
        fill="url(#xshatch)" stroke="#12406e" stroke-width="1.3"
        stroke-linejoin="round"/>

  <!-- the cutting plane -->
  <path d="M15.2 1.6 v20.8" fill="none" stroke="#e08a2e" stroke-width="1.5"/>
</svg>
