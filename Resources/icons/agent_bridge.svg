<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="linkA" x1="2" y1="22" x2="13" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8fe0"/><stop offset="1" stop-color="#1c5aa6"/>
    </linearGradient>
    <linearGradient id="linkB" x1="11" y1="13" x2="22" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2bb3a3"/><stop offset="1" stop-color="#16786d"/>
    </linearGradient>
  </defs>
  <!-- lower-left link -->
  <rect x="1.6" y="12.3" width="13" height="6.6" rx="3.3" fill="none"
        stroke="url(#linkA)" stroke-width="2.4" transform="rotate(-45 8.1 15.6)"/>
  <!-- upper-right link -->
  <rect x="9.4" y="5.1" width="13" height="6.6" rx="3.3" fill="none"
        stroke="url(#linkB)" stroke-width="2.4" transform="rotate(-45 15.9 8.4)"/>
  <!-- redraw the blue link's end-cap arc at one crossing on top: interlocked -->
  <path d="M13.61 12.77 A3.3 3.3 0 0 1 13.06 15.23" fill="none" stroke="#2064b2"
        stroke-width="2.4"/>
</svg>
